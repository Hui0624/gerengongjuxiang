<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <title>我的工作台</title>
  <!-- 皮肤在样式前应用，避免刷新闪一下 -->
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var skin = new URLSearchParams(location.search).get("skin");
        if (skin) q = "photo";
        var t = q || localStorage.getItem("wb_theme") || "dark";
        if (q && !skin) { try { localStorage.setItem("wb_theme", q); } catch (e) {} }
        var el = document.documentElement;
        el.setAttribute("data-theme", t);
        if (skin) {
          el.style.setProperty("--skin-image", 'url("' + skin + '")');
          el.style.setProperty("--skin-dim", "0.35");
          el.style.setProperty("--skin-blur", "0px");
          return;
        }
        if (t === "photo") {
          var img = localStorage.getItem("wb_skin_image") || "";
          var dim = localStorage.getItem("wb_skin_dim") || "42";
          var blur = localStorage.getItem("wb_skin_blur") || "0";
          if (img) el.style.setProperty("--skin-image", 'url("' + img + '")');
          el.style.setProperty("--skin-dim", (Number(dim) / 100).toFixed(2));
          el.style.setProperty("--skin-blur", blur + "px");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/>
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><path d="M17.25 13.8v7M13.75 17.3h7"/>
        </svg>
      </span>
      <span>我的工作台</span>
    </div>
    <div class="topbar-meta">
      <span id="todayLabel" class="today-label"></span>
      <span id="syncBadge" class="badge">本地存储</span>
    </div>
    <div class="topbar-actions">
      <button id="themeBtn" class="icon-btn" title="换皮肤">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="9.5" r="1.1" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="7.6" r="1.1" fill="currentColor" stroke="none"/>
          <circle cx="15.5" cy="9.5" r="1.1" fill="currentColor" stroke="none"/>
          <path d="M12 21c-1.6 0-2-1.2-1.4-2.2.6-1-.2-2.1-1.4-2.1H7.6"/>
        </svg>
      </button>
      <button id="importBtn" class="btn ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M4 17.5V19a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1.5"/>
        </svg>
        导入课表
      </button>
      <button id="settingsBtn" class="icon-btn" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.1"/>
          <path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.6 1.6 0 0 0 15 19.4a1.6 1.6 0 0 0-1 1.47V21a2 2 0 1 1-4 0v-.09A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.6 1.6 0 0 0 4.6 15a1.6 1.6 0 0 0-1.47-1H3a2 2 0 1 1 0-4h.09A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.6 1.6 0 0 0 9 4.6 1.6 1.6 0 0 0 10 3.13V3a2 2 0 1 1 4 0v.09A1.6 1.6 0 0 0 15 4.6a1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.6 1.6 0 0 0 19.4 9v.09a1.6 1.6 0 0 0 1.47 1H21a2 2 0 1 1 0 4h-.09a1.6 1.6 0 0 0-1.51.91z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidenav">
      <button class="nav-item active" data-view="timeline">
        <span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.4"/><path d="M8 3.2v3.4M16 3.2v3.4M3.5 10h17"/><path d="M8 14h3.5M8 17.2h6"/></svg></span>
        <span>时间线</span>
      </button>
      <button class="nav-item" data-view="todo">
        <span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5 6 8.5 9.5 5"/><path d="M4 13.5 6 15.5 9.5 12"/><path d="M4 20.5 6 22 9.5 19" opacity=".45"/><path d="M12.5 6.5H20M12.5 13.5H20M12.5 20.5H18"/></svg></span>
        <span>待办</span>
      </button>
      <button class="nav-item" data-view="skills">
        <span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9.5M9.3 19V5M14.6 19v-7.5M20 19v-4.5"/><path d="M3 21h18"/></svg></span>
        <span>技能</span>
      </button>
      <button class="nav-item" data-view="checkin">
        <span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c3.6 0 6.5-2.7 6.5-6.2 0-2.4-1.3-4.2-3-6.1-1.3-1.5-2.6-3.1-3-5.2-.6 1.6-1.7 2.7-2.9 4C8 9.2 6.4 11 6.4 13.5 6.4 17.8 8.9 21 12 21z"/><path d="M12 21c-1.6 0-2.8-1.3-2.8-2.9 0-1.6 1.1-2.6 2.8-4.4 1.5 1.7 2.8 2.8 2.8 4.4C14.8 19.7 13.6 21 12 21z" opacity=".5"/></svg></span>
        <span>打卡</span>
      </button>
    </nav>

    <main class="content">
      <!-- 时间线 / 周课表 -->
      <section id="view-timeline" class="view active">
        <div class="next-card" id="nextCard"></div>
        <div class="section-head">
          <h2 id="tlTitle">今日时间线</h2>
          <div class="seg" id="tlSeg">
            <button class="seg-btn active" data-mode="day">今日</button>
            <button class="seg-btn" data-mode="week">本周</button>
          </div>
          <span class="hint" id="tlHint">课程与待办混排 · 红线为当前时刻</span>
        </div>

        <div class="tl-scroll" id="tlScroll">
          <div class="tl-canvas" id="tlCanvas"></div>
        </div>

        <div id="weekPane" class="wk-pane hidden">
          <div class="wk-toolbar">
            <div class="wk-nav">
              <button class="icon-btn" id="wkPrev" title="上一周">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5 7.5 12l7 7"/></svg>
              </button>
              <span class="wk-label" id="wkLabel">第 ? 周</span>
              <button class="icon-btn" id="wkNext" title="下一周">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5l7 7-7 7"/></svg>
              </button>
              <button class="btn ghost" id="wkNow">本周</button>
            </div>
            <span class="wk-range" id="wkRange"></span>
            <label class="wk-term">
              <span>第1周周一</span>
              <input type="date" id="wkTermStart" class="input">
            </label>
            <span class="wk-note" id="wkNote"></span>
          </div>
          <div class="wk-scroll">
            <div class="wk-grid" id="wkGrid"></div>
          </div>
        </div>
      </section>

      <!-- 待办 -->
      <section id="view-todo" class="view">
        <div class="section-head"><h2>待办清单</h2><span class="hint">设定时间后会出现在时间线上</span></div>
        <div class="add-row">
          <input id="todoText" class="input" placeholder="要做什么？例如：复习英语单词" />
          <input id="todoTime" class="input time-input" type="time" title="可选：设定时间" />
          <button id="todoAdd" class="btn primary">添加</button>
        </div>
        <div id="todoList" class="todo-list"></div>
      </section>

      <!-- 技能 -->
      <section id="view-skills" class="view">
        <div class="section-head"><h2>日常技能</h2><span class="hint">拖动进度条更新 · 训练方法可随时改</span></div>
        <div id="skillGrid" class="skill-grid"></div>
        <button id="skillAdd" class="btn ghost wide">＋ 添加技能</button>
      </section>

      <!-- 打卡 -->
      <section id="view-checkin" class="view">
        <div class="section-head"><h2>每日打卡</h2><span class="hint">点一下记录今天 · 连续天数自动统计</span></div>
        <div id="habitList" class="habit-list"></div>
        <div class="add-row">
          <input id="habitText" class="input" placeholder="新习惯，例如：早起 6:30" />
          <button id="habitAdd" class="btn primary">添加习惯</button>
        </div>
      </section>
    </main>
  </div>

  <!-- 通用弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><h3 id="modalTitle">标题</h3><button id="modalClose" class="icon-btn">✕</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
